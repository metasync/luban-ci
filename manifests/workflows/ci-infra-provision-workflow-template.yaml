apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ci-infra-provision-template
  namespace: luban-ci
spec:
  entrypoint: provision-ci-infra
  serviceAccountName: luban-ci-sa
  arguments:
    parameters:
      - name: project_name
      - name: git_organization
      - name: git_provider
      - name: admin_group
        value: ""
      - name: developer_group
        value: ""
      - name: gitops_utils_image
        valueFrom:
          configMapKeyRef:
            name: luban-config
            key: gitops_utils_image

  templates:
  - name: provision-ci-infra
    inputs:
      parameters:
      - name: project_name
      - name: git_organization
      - name: git_provider
      - name: admin_group
      - name: developer_group
    steps:
    - - name: update-repo
        templateRef:
          name: infra-repo-update-template
          template: update-infra-ci-repo
        arguments:
          parameters:
          - name: repo_name
            value: "luban-infra-ci"
          - name: project_name
            value: "{{inputs.parameters.project_name}}"
          - name: git_organization
            value: "{{inputs.parameters.git_organization}}"
          - name: git_provider
            value: "{{inputs.parameters.git_provider}}"
          - name: admin_group
            value: "{{inputs.parameters.admin_group}}"
          - name: developer_group
            value: "{{inputs.parameters.developer_group}}"

    - - name: create-argo-app
        template: create-ci-app
        arguments:
          parameters:
          - name: project_name
            value: "{{inputs.parameters.project_name}}"
          - name: git_organization
            value: "{{inputs.parameters.git_organization}}"
          - name: git_provider
            value: "{{inputs.parameters.git_provider}}"

  - name: create-ci-app
    inputs:
      parameters:
      - name: project_name
      - name: git_organization
      - name: git_provider
    container:
      image: "{{workflow.parameters.gitops_utils_image}}"
      env:
        - name: GIT_SERVER
          valueFrom:
            configMapKeyRef:
              name: luban-config
              key: "{{inputs.parameters.git_provider}}_server"
        - name: GIT_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: luban-config
              key: "{{inputs.parameters.git_provider}}_base_url"
              optional: true
        - name: CILIUM_EGRESS_GATEWAY_POLICY
          valueFrom:
            configMapKeyRef:
              name: luban-config
              key: cilium_egress_gateway_policy
              optional: true
      command: [/usr/local/bin/argocd_apply_ci_infra_app.sh]
      args:
        - "{{inputs.parameters.project_name}}"
        - "{{inputs.parameters.git_organization}}"
        - "{{inputs.parameters.git_provider}}"

  volumeClaimTemplates:
  - metadata:
      name: workdir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Mi
