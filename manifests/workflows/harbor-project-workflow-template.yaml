apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: harbor-project-setup-template
  namespace: luban-ci
spec:
  entrypoint: create-project
  serviceAccountName: luban-ci-sa
  volumes:
    - name: luban-ca-cert
      secret:
        secretName: luban-ca-cert
        optional: true
  arguments:
    parameters:
      - name: project_name
        description: "Name of the Harbor project to create"
      - name: registry_visibility
        description: "Project visibility (public or private)"
        value: "public"
        enum:
          - "public"
          - "private"
      - name: registry_server
        description: "Registry server domain (e.g. harbor.example.com)"
        valueFrom:
          configMapKeyRef:
            name: luban-config
            key: registry_server
            optional: true
      - name: gitops_utils_image
        description: "Image for GitOps utility tools"
        valueFrom:
          configMapKeyRef:
            name: luban-config
            key: gitops_utils_image

  templates:
    - name: create-project
      inputs:
        parameters:
          - name: project_name
          - name: registry_visibility
      container:
        image: "{{workflow.parameters.gitops_utils_image}}"
        command: [/usr/local/bin/harbor_create_project.sh]
        args:
          - "{{inputs.parameters.project_name}}"
          - "{{inputs.parameters.registry_visibility}}"
        env:
          - name: CURL_CA_BUNDLE
            valueFrom:
              secretKeyRef:
                name: luban-ca-cert
                key: curl_ca_bundle
                optional: true
          - name: REGISTRY_SERVER
            valueFrom:
              configMapKeyRef:
                name: luban-config
                key: registry_server
                optional: true
          - name: HARBOR_USERNAME
            valueFrom:
              secretKeyRef:
                name: harbor-api-creds
                key: HARBOR_USERNAME
          - name: HARBOR_PASSWORD
            valueFrom:
              secretKeyRef:
                name: harbor-api-creds
                key: HARBOR_PASSWORD
        volumeMounts:
          - name: luban-ca-cert
            mountPath: /var/run/luban/ca
            readOnly: true
