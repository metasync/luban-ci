apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: luban-ci-kpack-template
  # Cluster resources do not have a namespace
spec:
  entrypoint: ci-pipeline
  serviceAccountName: workflow-runner
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  volumes:
    - name: luban-ca-cert
      secret:
        secretName: luban-ca-cert
        optional: true
  # Keep pods until the workflow is deleted to ensure logs are available
  podGC:
    strategy: OnWorkflowDeletion
  # Automatically delete the workflow (and pods) after a delay to clean up
  ttlStrategy:
    secondsAfterCompletion: 86400 # 24 hours
    secondsAfterSuccess: 3600     # 1 hour (clean up successful runs faster)
    secondsAfterFailure: 86400    # 24 hours (keep failed runs longer)
  synchronization:
    semaphores:
      - configMapKeyRef:
          name: workflow-semaphores
          key: kpack-builds
  arguments:
    parameters:
      - name: repo_url
        description: "URL of the source code repository"
      - name: registry_namespace
        description: "Organization/Namespace for the registry (e.g., 'metasync')"
      - name: revision
        description: "Commit revision to build"
      - name: app_name
        description: "Name of the application"
      - name: sub_path
        description: "Sub-path within the repository to build"
        value: ""
      - name: git_ref
        description: "Git reference (branch or tag)"
        value: ""
      - name: tag
        description: "Explicit image tag to use (overrides revision)"
        value: ""
      - name: git_provider
        description: "Git Provider (e.g., 'github', 'gitlab')"
        value: "github"
      - name: git_creds_secret
        description: "Name of the secret containing git credentials"
        value: "github-creds"
      - name: registry_server
        description: "Registry server to push image to"
        valueFrom:
          configMapKeyRef:
            name: luban-config
            key: registry_server
            optional: true
      - name: gitops_branch
        description: "Branch in GitOps repo to update (usually 'develop')"
        value: "develop"
      - name: deploy_env
        description: "Deployment environment (e.g., 'snd', 'prd')"
        value: "snd"
      - name: gitops_utils_image
        description: "Image for GitOps utility tools"
        valueFrom:
          configMapKeyRef:
            name: luban-config
            key: gitops_utils_image

  volumeClaimTemplates:
  - metadata:
      name: workdir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

  templates:
  - name: ci-pipeline
    steps:
    - - name: build-push-by-commit
        template: build-push
        when: "'{{workflow.parameters.git_ref}}' !~ '^refs/tags/'"
        arguments:
          parameters:
            - name: namespace
              value: "{{workflow.parameters.registry_namespace}}"
            - name: mode
              value: commit
      - name: build-push-by-tag
        template: build-push
        when: "'{{workflow.parameters.git_ref}}' =~ '^refs/tags/'"
        arguments:
          parameters:
            - name: namespace
              value: "{{workflow.parameters.registry_namespace}}"
            - name: mode
              value: tag
    
    - - name: update-gitops
        template: git-update
        arguments:
          parameters:
            - name: namespace
              value: "{{workflow.parameters.registry_namespace}}"

  - name: build-push
    inputs:
      parameters:
        - name: namespace
        - name: mode
    outputs:
      parameters:
      - name: image_tag
        valueFrom:
          path: /tmp/image_tag
    container:
      image: "{{workflow.parameters.gitops_utils_image}}"
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      command: [sh, -ceu]
      args:
      - |
        /usr/local/bin/kpack_apply_image_spec.sh "{{inputs.parameters.mode}}" "{{workflow.parameters.sub_path}}"
        /usr/local/bin/kpack_wait_build.sh

      env:
      - name: SSL_CERT_FILE
        valueFrom:
          secretKeyRef:
            name: luban-ca-cert
            key: ssl_cert_file
            optional: true
      - name: REQUESTS_CA_BUNDLE
        valueFrom:
          secretKeyRef:
            name: luban-ca-cert
            key: requests_ca_bundle
            optional: true
      - name: GIT_SSL_CAINFO
        valueFrom:
          secretKeyRef:
            name: luban-ca-cert
            key: git_ssl_cainfo
            optional: true
      - name: CURL_CA_BUNDLE
        valueFrom:
          secretKeyRef:
            name: luban-ca-cert
            key: curl_ca_bundle
            optional: true
      - name: REGISTRY_NAMESPACE
        value: "{{inputs.parameters.namespace}}"
      - name: REPO_URL
        value: "{{workflow.parameters.repo_url}}"
      - name: GIT_PROVIDER
        value: "{{workflow.parameters.git_provider}}"
      - name: REVISION
        value: "{{workflow.parameters.revision}}"
      - name: APP_NAME
        value: "{{workflow.parameters.app_name}}"
      - name: TAG
        value: "{{workflow.parameters.tag}}"
      - name: GIT_REF
        value: "{{workflow.parameters.git_ref}}"
      - name: registry_server
        value: "{{workflow.parameters.registry_server}}"
      volumeMounts:
      - name: workdir
        mountPath: /workdir
      - name: luban-ca-cert
        mountPath: /var/run/luban/ca
        readOnly: true

  - name: git-update
    inputs:
      parameters:
        - name: namespace
    container:
      image: "{{workflow.parameters.gitops_utils_image}}"
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      command: [/usr/local/bin/gitops_update_repo.sh]
      env:
      - name: SSL_CERT_FILE
        valueFrom:
          secretKeyRef:
            name: luban-ca-cert
            key: ssl_cert_file
            optional: true
      - name: REQUESTS_CA_BUNDLE
        valueFrom:
          secretKeyRef:
            name: luban-ca-cert
            key: requests_ca_bundle
            optional: true
      - name: GIT_SSL_CAINFO
        valueFrom:
          secretKeyRef:
            name: luban-ca-cert
            key: git_ssl_cainfo
            optional: true
      - name: CURL_CA_BUNDLE
        valueFrom:
          secretKeyRef:
            name: luban-ca-cert
            key: curl_ca_bundle
            optional: true
      - name: REGISTRY_NAMESPACE
        value: "{{inputs.parameters.namespace}}"
      - name: GIT_USERNAME
        valueFrom:
          secretKeyRef:
            name: "{{workflow.parameters.git_creds_secret}}"
            key: username
      - name: GIT_TOKEN
        valueFrom:
          secretKeyRef:
            name: "{{workflow.parameters.git_creds_secret}}"
            key: token
      - name: APP_NAME
        value: "{{workflow.parameters.app_name}}"
      - name: REVISION
        value: "{{workflow.parameters.revision}}"
      - name: TAG
        value: "{{workflow.parameters.tag}}"
      - name: GIT_REF
        value: "{{workflow.parameters.git_ref}}"
      - name: REPO_URL
        value: "{{workflow.parameters.repo_url}}"
      - name: GIT_PROVIDER
        value: "{{workflow.parameters.git_provider}}"
      - name: GITOPS_BRANCH
        value: "{{workflow.parameters.gitops_branch}}"
      - name: DEPLOY_ENV
        value: "{{workflow.parameters.deploy_env}}"
      - name: registry_server
        value: "{{workflow.parameters.registry_server}}"
      - name: GIT_HTTPS_AUTH_MODE
        valueFrom:
          configMapKeyRef:
            name: luban-config
            key: "{{workflow.parameters.git_provider}}_https_auth_mode"
            optional: true
      - name: GIT_BASIC_AUTH_USERNAME
        valueFrom:
          configMapKeyRef:
            name: luban-config
            key: "{{workflow.parameters.git_provider}}_basic_auth_username"
            optional: true
      volumeMounts:
      - name: workdir
        mountPath: /workdir
      - name: luban-ca-cert
        mountPath: /var/run/luban/ca
        readOnly: true
