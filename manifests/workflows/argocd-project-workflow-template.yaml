apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: argocd-project-setup-template
  namespace: luban-ci
spec:
  entrypoint: create-projects
  serviceAccountName: luban-ci-sa
  arguments:
    parameters:
      - name: project_name
        description: "Name of the project/team (e.g., 'payment')"
      - name: environment
        description: "Target environment (e.g., 'snd', 'prd')"
        value: "snd"
      - name: git_organization
        description: "Git Organization/User (defaults to project_name if empty)"
        value: ""
      - name: git_provider
        description: "Git Provider (e.g., 'github', 'azure', 'ado')"
        value: "azure"
        enum:
          - "github"
          - "azure"
          - "ado"
      - name: developer_group
        description: "OIDC group for developer access (Single Group)"
        value: ""
      - name: admin_group
        description: "OIDC group for admin access (Single Group)"
        value: ""
      - name: gitops_utils_image
        description: "Image for GitOps utility tools"
        valueFrom:
          configMapKeyRef:
            name: luban-config
            key: gitops_utils_image

  templates:
  - name: create-projects
    inputs:
      parameters:
      - name: environment
    steps:
    - - name: ensure-project
        template: ensure-project
        arguments:
          parameters:
          - name: environment
            value: "{{inputs.parameters.environment}}"
          - name: project_name
            value: "{{workflow.parameters.project_name}}"
          - name: git_provider
            value: "{{workflow.parameters.git_provider}}"
          - name: git_organization
            value: "{{workflow.parameters.git_organization}}"

  - name: ensure-project
    inputs:
      parameters:
      - name: environment
      - name: project_name
      - name: git_provider
      - name: git_organization
    steps:
    - - name: check-exists
        template: check-project-exists
        arguments:
          parameters:
          - name: environment
            value: "{{inputs.parameters.environment}}"
          - name: project_name
            value: "{{inputs.parameters.project_name}}"
    - - name: create-project
        template: create-project-resource
        arguments:
          parameters:
          - name: environment
            value: "{{inputs.parameters.environment}}"
          - name: project_name
            value: "{{inputs.parameters.project_name}}"
          - name: git_provider
            value: "{{inputs.parameters.git_provider}}"
          - name: git_organization
            value: "{{inputs.parameters.git_organization}}"
        when: "{{steps.check-exists.outputs.result}} == false"

  - name: check-project-exists
    inputs:
      parameters:
      - name: environment
      - name: project_name
    script:
      image: "{{workflow.parameters.gitops_utils_image}}"
      command: [sh]
      source: |
        PROJECT_NAME="{{inputs.parameters.environment}}-{{inputs.parameters.project_name}}"
        echo "Checking if ArgoCD project $PROJECT_NAME exists..." >&2
        if kubectl get appproject $PROJECT_NAME -n argocd > /dev/null 2>&1; then
          echo "Project $PROJECT_NAME already exists." >&2
          echo "true"
        else
          echo "Project $PROJECT_NAME does not exist." >&2
          echo "false"
        fi

  - name: create-project-resource
    inputs:
      parameters:
      - name: environment
      - name: project_name
      - name: git_provider
      - name: git_organization
    container:
      image: "{{workflow.parameters.gitops_utils_image}}"
      env:
        - name: GITHUB_SERVER
          valueFrom:
            configMapKeyRef:
              name: luban-config
              key: github_server
        - name: GIT_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: luban-config
              key: "{{inputs.parameters.git_provider}}_base_url"
              optional: true
        - name: AZURE_SERVER
          valueFrom:
            configMapKeyRef:
              name: luban-config
              key: azure_server
              optional: true
        - name: ADO_SERVER
          valueFrom:
            configMapKeyRef:
              name: luban-config
              key: ado_server
              optional: true
        - name: CLUSTER_MAP
          valueFrom:
            configMapKeyRef:
              name: luban-config
              key: cluster_map
      command: [/usr/local/bin/argocd_apply_appproject.sh]
      args:
        - "{{inputs.parameters.environment}}"
        - "{{inputs.parameters.project_name}}"
        - "{{inputs.parameters.git_provider}}"
        - "{{inputs.parameters.git_organization}}"
        - "{{workflow.parameters.admin_group}}"
        - "{{workflow.parameters.developer_group}}"
