scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

run_launcher:
  module: luban_dagster_platform.k8s_run_launcher
  class: CodeLocationAwareK8sRunLauncher
  config:
    service_account_name: "{{cookiecutter.app_name}}-sa"
    job_namespace:
      env: DAGSTER_K8S_PIPELINE_RUN_NAMESPACE
    image_pull_policy: Always
    env_config_maps:
      - dagster-env
      - dagster-observability
    # ── Per-code-location env injection ──────────────────────────────
    #
    # The run launcher ensures every run pod (including ad-hoc asset
    # materializations like __ASSET_JOB) receives the correct ConfigMaps
    # and Secrets for its code location.
    #
    # Auto-discovery (no config needed):
    #   Every code location automatically gets:
    #     ConfigMap: `<location>-config`
    #     Secret:    `<location>-secret`
    #   (matches the naming convention set by code location deployments)
    #
    # Secret expectation:
    #   `<location>-secret` is expected to exist. If a pipeline does not need any
    #   secrets, create an empty Secret with that name to keep the convention.
    #
    # Explicit entries (optional, augments auto-discovery):
    #   Add entries to code_location_env below to append extra env_vars,
    #   extra ConfigMaps/Secrets, or custom k8s_config.
    #   Explicit entries are MERGED on top of auto-discovered defaults,
    #   they do NOT replace them.
    #
    # env_vars format:
    #   Use `NAME=value` strings. NAME must match `[A-Za-z_][A-Za-z0-9_]*`.
    #
    # Merge rules for dagster-k8s/config:
    #   envFrom    ─ platform items first, then user items (deduped)
    #   env        ─ platform vars first by name, user vars preserved
    #   other keys ─ deep-merged (platform augments, platform wins on conflict)
    #
    # Example with no overrides (auto-discovery only):
    #   code_location_env: {}
    #
    # Example with overrides:
    #   code_location_env:
    #     my_etl:
    #       env_config_maps: ["extra-env"]
    #       env_vars: ["CUSTOM_VAR=value"]
    code_location_env: {}
    instance_config_map: dagster-instance
    postgres_password_secret: dagster-postgresql-secret
    run_k8s_config:
      job_spec_config:
        ttl_seconds_after_finished: {{cookiecutter.run_job_ttl_seconds_after_finished}}

compute_logs:
  module: dagster.core.storage.noop_compute_log_manager
  class: NoOpComputeLogManager

run_monitoring:
  enabled: true
  start_timeout_seconds: 300
  max_resume_run_attempts: 0
  poll_interval_seconds: 120
  free_slots_after_run_end_seconds: 0

run_retries:
  enabled: true

sensors:
  use_threads: true
  num_workers: 4

schedules:
  use_threads: true
  num_workers: 4

run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT

event_log_storage:
  module: dagster_postgres.event_log
  class: PostgresEventLogStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT

schedule_storage:
  module: dagster_postgres.schedule_storage
  class: PostgresScheduleStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT

retention:
  sensor:
    purge_after_days:
      failure: 7
      skipped: 7
      started: 7
      success: 7
  schedule:
    purge_after_days: 7
  auto_materialize:
    purge_after_days:
      failure: 7
      skipped: 7
      started: 7
      success: 7

telemetry:
  enabled: false
